name: Build Dartist Widget Companion
on:
  workflow_dispatch:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/build-widget-companion.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p companion assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dartist-Widget-Companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
